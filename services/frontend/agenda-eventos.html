<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos programados | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/agenda.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>

      <section class="main-panel">
        <header id="shared-topbar"></header>

        <div class="page-wrap">
          <section class="module-header card">
            <div>
              <p class="badge">Agenda</p>
              <h1>Eventos programados</h1>
              <p class="subtitle">Consulta, filtra, edita, elimina y factura citas desde una sola bandeja.</p>
            </div>
            <div class="quick-actions">
              <a class="btn btn-primary" href="/agenda-crear.html">Crear evento</a>
            </div>
          </section>

          <section class="card filters">
            <label>
              Buscar
              <input id="search" type="text" placeholder="Título o descripción" />
            </label>
            <label>
              Estado
              <select id="status-filter">
                <option value="">Todos</option>
                <option value="pending">Pendiente</option>
                <option value="done">Completado</option>
                <option value="cancelled">Cancelado</option>
              </select>
            </label>
            <label>
              Servicio
              <select id="service-filter"></select>
            </label>
            <label>
              Colaborador
              <select id="collaborator-filter"></select>
            </label>
            <label>
              Desde
              <input id="date-from-filter" type="date" />
            </label>
            <label>
              Hasta
              <input id="date-to-filter" type="date" />
            </label>
            <button id="load-events" class="btn btn-primary" type="button">Aplicar filtros</button>
          </section>

          <section class="card">
            <h2>Eventos programados</h2>
            <p class="subtitle" id="feedback">Sin datos cargados.</p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Título</th>
                    <th>Servicio</th>
                    <th>Colaborador</th>
                    <th>Inicio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="events-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/forms.js"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script src="/assets/js/pagination.js"></script>
    <script>
      window.renderSharedNavigation({ activeModule: 'agenda-eventos' });
    </script>
    <script src="/assets/js/agenda.js"></script>
  </body>
</html>
