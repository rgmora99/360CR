<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoagendamiento | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/self-booking.css" />
  </head>
  <body>
    <main class="self-book-shell">
      <section class="card self-book-card">
        <p class="badge">Portal cliente</p>
        <h1>Agenda tu cita</h1>
        <p id="self-book-subtitle" class="subtitle">Completa los datos para reservar según disponibilidad real.</p>

        <form id="self-book-form" class="self-book-grid">
          <label>Servicio<select id="self-service" required></select></label>
          <label>Colaborador<select id="self-collaborator" required></select></label>
          <label>Fecha<input id="self-date" type="date" required /></label>
          <label>Inicio<input id="self-start" type="time" required /></label>
          <label>Fin<input id="self-end" type="time" required /></label>
          <label>Nombre cliente<input id="self-title" required placeholder="Ej: Cita Juan Pérez" /></label>
          <button class="btn btn-primary" type="button" id="check-availability">Ver disponibilidad</button>
          <button class="btn btn-secondary" type="submit">Agendar cita</button>
        </form>

        <pre id="availability-result" class="availability-result">Sin consulta.</pre>
      </section>
    </main>

    <script src="/assets/js/self-booking.js"></script>
  </body>
</html>
