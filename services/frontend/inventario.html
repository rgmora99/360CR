<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/customers.css" />
    <link rel="stylesheet" href="/assets/css/pages/facturacion.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>
      <section class="main-panel">
        <header id="shared-topbar"></header>
        <div class="page-wrap">
          <section class="module-header card">
            <h1>Inventario</h1>
            <p class="subtitle">CRUD de productos separado del módulo de facturación.</p>
          </section>
          <section class="card filters">
            <label>Organización<input id="organization-id" type="number" min="1" value="1" /></label>
            <a class="btn btn-secondary" href="/facturacion.html">Volver a Facturación</a>
          </section>
          <section class="card">
            <form id="product-form" class="customer-form">
              <input type="hidden" id="product-id" />
              <div class="form-grid">
                <label>SKU<input id="sku" readonly /></label>
                <label>Tipo
                  <select id="product-type" required>
                    <option value="physical">Producto</option>
                    <option value="service">Servicio</option>
                  </select>
                </label>
                <label>Nombre<input id="product-name" required /></label>
                <label>Descripción<input id="description" placeholder="Tamaño, color, marca..." /></label>
                <label id="field-physical-location">Sucursal / ubicación
                  <select id="physical-location">
                    <option value="">Selecciona ubicación</option>
                  </select>
                </label>
                <label id="field-supplier">Proveedor
                  <select id="supplier-id">
                    <option value="">Sin proveedor</option>
                  </select>
                </label>
                <label>Precio<input id="unit-price" type="number" step="0.01" min="0.01" required /></label>
                <label>Costo por unidad<input id="cost-price" type="number" step="0.01" min="0.01" value="0.01" required /></label>
                <label>Impuesto %<input id="tax-rate" type="number" step="0.01" min="0" max="100" value="13" required /></label>
                <label id="field-stock">Stock<input id="stock" type="number" min="0" value="0" required /></label>
                <label id="field-requires-duration">Requiere duración
                  <select id="service-requires-duration">
                    <option value="yes">Sí</option>
                    <option value="no">No</option>
                  </select>
                </label>
                <label id="field-service-duration">Duración servicio (min)<input id="service-duration-minutes" type="number" min="1" value="30" /></label>
                <label id="field-item-status">Estado
                  <select id="item-status" required>
                    <option value="ok">Buen estado</option>
                    <option value="damaged">Dañado</option>
                    <option value="raw_material">Materia prima</option>
                  </select>
                </label>
              </div>
              <div class="actions"><button class="btn btn-primary" type="submit">Guardar producto</button></div>
            </form>
            <div class="table-wrap"><table><thead><tr><th>SKU</th><th>Nombre y descripción</th><th>Sucursal / ubicación</th><th>Proveedor</th><th>Costo</th><th>Precio</th><th>Stock</th><th>Duración</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="products-body"></tbody></table></div>
            <p id="feedback" class="subtitle"></p>
          </section>
        </div>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script src="/assets/js/pagination.js"></script>
    <script>window.renderSharedNavigation({ activeModule: 'inventario' });</script>
    <script src="/assets/js/inventario.js"></script>
  </body>
</html>
