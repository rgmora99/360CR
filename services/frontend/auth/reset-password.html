<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/auth.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card card">
        <a class="back-link" href="/auth/login.html">← Volver a iniciar sesión</a>
        <h1>Nueva contraseña</h1>
        <p class="subtitle">Define una contraseña nueva para recuperar el acceso a tu cuenta.</p>

        <form class="auth-form" id="password-reset-form">
          <label for="new_password">Nueva contraseña</label>
          <input id="new_password" name="new_password" type="password" minlength="8" placeholder="mínimo 8 caracteres" required />

          <label for="confirm_password">Confirmar contraseña</label>
          <input id="confirm_password" name="confirm_password" type="password" minlength="8" placeholder="repite la contraseña" required />

          <button class="btn btn-primary btn-full" type="submit">Guardar contraseña</button>
        </form>

        <p class="switch-link">¿Ya la recordaste? <a href="/auth/login.html">Inicia sesión</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/forms.js"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
