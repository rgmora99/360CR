<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/auth.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card card">
        <a class="back-link" href="/">← Volver al inicio</a>
        <h1>Crear cuenta</h1>
        <p class="subtitle">Regístrate con Gmail o de forma tradicional.</p>

        <div id="google-register-button" class="google-auth-slot"></div>
        <p class="divider">o registro normal</p>

        <form class="auth-form" id="register-form">
          <label for="business">Nombre de negocio</label>
          <input id="business" name="business" type="text" placeholder="Mi Pyme" required />

          <div class="auth-form-grid">
            <div>
              <label for="first_name">Nombre</label>
              <input id="first_name" name="first_name" type="text" placeholder="Tu nombre" required />
            </div>
            <div>
              <label for="last_name">Apellidos</label>
              <input id="last_name" name="last_name" type="text" placeholder="Tus apellidos" required />
            </div>
          </div>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="correo@empresa.com" required />

          <label for="phone">Teléfono</label>
          <input id="phone" name="phone" type="tel" placeholder="8888-8888" required />

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" minlength="8" placeholder="mínimo 8 caracteres" required />

          <button class="btn btn-primary btn-full" type="submit">Crear cuenta</button>
        </form>

        <p class="switch-link">¿Ya tienes cuenta? <a href="/auth/login.html">Inicia sesión</a></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
