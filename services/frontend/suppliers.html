<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Módulo Proveedores | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/suppliers.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>

      <section class="main-panel">
        <header id="shared-topbar"></header>

        <div class="page-wrap">
          <section class="module-header card">
            <div>
              <p class="badge">Módulo</p>
              <h1>Gestión de Proveedores</h1>
              <p class="subtitle">Administra proveedores de forma centralizada para personas físicas y jurídicas. Crea y filtra en tiempo real sin mantener la edición dentro del alta principal.</p>
            </div>
            <div class="quick-actions">
              <a class="btn btn-secondary" href="/templates/proveedores-carga-masiva.csv" download>Descargar plantilla</a>
              <button class="btn btn-secondary" type="button" id="supplier-import-csv-button">Cargar CSV</button>
              <a class="btn btn-primary" href="/suppliers-list.html">Ver listado</a>
            </div>
          </section>

          <input id="supplier-import-csv-input" class="visually-hidden" type="file" accept=".csv,text/csv" />
          <p id="feedback" class="module-inline-feedback"></p>

          <section class="management-stack">
            <article class="card form-card form-card--full">
              <h2>Nuevo proveedor</h2>
              <form id="supplier-form" class="customer-form">
                <div class="form-grid">
                  <label>Código<input id="code" required readonly /></label>
                  <label>Tipo de proveedor<select id="supplier-type" required></select></label>
                  <label id="tax-id-label">Cédula jurídica<input id="tax-id" /></label>
                  <label id="legal-name-label">Razón social<input id="legal-name" required /></label>
                  <label id="trade-name-wrapper">Nombre comercial<input id="trade-name" /></label>
                  <label>Estado
                    <select id="status">
                      <option value="active">Activo</option>
                      <option value="inactive">Inactivo</option>
                      <option value="blocked">Bloqueado</option>
                    </select>
                  </label>
                  <label>Correo<input id="email" type="email" /></label>
                  <label>Teléfono<input id="phone" /></label>
                  <label>Límite de crédito<input id="credit-limit" type="number" step="0.01" value="0" /></label>
                  <label>Días de pago<input id="payment-terms-days" type="number" min="0" value="0" /></label>
                </div>
                <label>Notas<textarea id="notes" rows="3"></textarea></label>
                <div class="actions">
                  <button class="btn btn-primary" type="submit">Guardar proveedor</button>
                </div>
              </form>
            </article>
          </section>
        </div>
      </section>
    </div>

    <div id="supplier-edit-modal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="supplier-edit-title">
        <div class="modal-card__header">
          <div>
            <p class="badge">Edición</p>
            <h2 id="supplier-edit-title">Editar proveedor</h2>
          </div>
          <button id="supplier-edit-close" class="btn btn-secondary modal-close" type="button">Cerrar</button>
        </div>
        <form id="supplier-edit-form" class="customer-form">
          <input type="hidden" id="edit-supplier-id" />
          <div class="form-grid">
            <label>Código<input id="edit-code" required readonly /></label>
            <label>Tipo de proveedor<select id="edit-supplier-type" required></select></label>
            <label id="edit-tax-id-label">Cédula jurídica<input id="edit-tax-id" /></label>
            <label id="edit-legal-name-label">Razón social<input id="edit-legal-name" required /></label>
            <label id="edit-trade-name-wrapper">Nombre comercial<input id="edit-trade-name" /></label>
            <label>Estado
              <select id="edit-status">
                <option value="active">Activo</option>
                <option value="inactive">Inactivo</option>
                <option value="blocked">Bloqueado</option>
              </select>
            </label>
            <label>Correo<input id="edit-email" type="email" /></label>
            <label>Teléfono<input id="edit-phone" /></label>
            <label>Límite de crédito<input id="edit-credit-limit" type="number" step="0.01" value="0" /></label>
            <label>Días de pago<input id="edit-payment-terms-days" type="number" min="0" value="0" /></label>
          </div>
          <label>Notas<textarea id="edit-notes" rows="3"></textarea></label>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
            <button id="supplier-edit-cancel" class="btn btn-secondary" type="button">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/forms.js"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script src="/assets/js/pagination.js"></script>
    <script>
      window.renderSharedNavigation({ activeModule: 'proveedores-gestion' });
    </script>
    <script src="/assets/js/cedula-padron.js"></script>
    <script src="/assets/js/suppliers.js"></script>
  </body>
</html>
