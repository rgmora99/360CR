<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histórico de facturas | 360CR</title>
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/customers.css" />
    <style>
      .invoice-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(2, 6, 23, 0.74);
        z-index: 1100;
      }

      #feedback {
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .invoice-modal.is-open {
        display: flex;
      }

      .invoice-modal__panel {
        width: min(1280px, calc(100vw - 32px));
        max-height: 90vh;
        overflow: auto;
        background: #10192d;
        border: 1px solid rgba(122, 162, 255, 0.26);
        border-radius: 18px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        padding: 20px;
      }

      .invoice-modal__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .invoice-modal__grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.85fr) minmax(360px, 1.15fr);
        gap: 20px;
      }

      .invoice-modal__card {
        min-width: 0;
        padding: 16px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .invoice-modal__card h3 {
        margin: 0 0 12px;
      }

      .invoice-modal__meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 16px;
      }

      .invoice-modal__meta span {
        display: block;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .invoice-modal__meta strong {
        display: block;
        margin-top: 2px;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .invoice-modal__pdf {
        width: 100%;
        max-width: 100%;
        height: min(66vh, 720px);
        min-height: 520px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        background: #fff;
      }

      .invoice-modal__pdf-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        min-width: 0;
      }

      .invoice-modal__pdf-toolbar strong,
      .invoice-modal__pdf-toolbar span {
        display: block;
      }

      .invoice-modal__pdf-toolbar span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .invoice-modal__pdf-toolbar > div:first-child {
        min-width: 0;
      }

      .invoice-modal__pdf-toolbar strong {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .invoice-modal__pdf-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
        flex-shrink: 0;
      }

      .invoice-modal__line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .invoice-modal__line > div,
      .invoice-modal__line strong {
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .invoice-modal__line:last-child {
        border-bottom: 0;
      }

      @media (max-width: 900px) {
        .invoice-modal__grid {
          grid-template-columns: 1fr;
        }

        .invoice-modal__pdf-toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .invoice-modal__pdf-actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-layout" data-inbox-view="history">
      <aside id="shared-sidebar"></aside>
      <section class="main-panel">
        <header id="shared-topbar"></header>
        <div class="page-wrap">
          <section class="module-header card">
            <h1>Histórico de facturas electrónicas</h1>
            <p class="subtitle">Consulta facturas ya procesadas, aprobadas o rechazadas, con su trazabilidad completa.</p>
          </section>

          <section class="card">
            <div class="form-grid">
              <label>Organización<select id="organization-id"></select></label>
              <label>
                Estado
                <select id="status-filter">
                  <option value="">Todos</option>
                  <option value="registered">Registrada</option>
                  <option value="rejected">Rechazada</option>
                </select>
              </label>
              <div class="actions">
                <a class="btn btn-secondary" href="/bandeja-facturas.html">Ir a bandeja</a>
              </div>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Proveedor</th>
                    <th>Factura</th>
                    <th>Subtotal</th>
                    <th>IVA</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="inbox-body"></tbody>
              </table>
            </div>
            <p id="feedback" class="subtitle"></p>
          </section>
        </div>
      </section>
    </div>

    <div id="invoice-modal" class="invoice-modal" aria-hidden="true">
      <div class="invoice-modal__panel">
        <div class="invoice-modal__header">
          <div>
            <h2 id="invoice-modal-title">Detalle de factura</h2>
            <p id="invoice-modal-subtitle" class="subtitle"></p>
          </div>
          <button id="invoice-modal-close" class="btn btn-secondary" type="button">Cerrar</button>
        </div>
        <div class="invoice-modal__grid">
          <section class="invoice-modal__card">
            <h3>Información general</h3>
            <div id="invoice-modal-meta" class="invoice-modal__meta"></div>
          </section>
          <section class="invoice-modal__card">
            <h3>PDF adjunto</h3>
            <div id="invoice-modal-pdf"></div>
          </section>
          <section class="invoice-modal__card">
            <h3>Líneas de factura</h3>
            <div id="invoice-modal-lines"></div>
          </section>
          <section class="invoice-modal__card">
            <h3>Estado y trazabilidad</h3>
            <div id="invoice-modal-status" class="invoice-modal__meta"></div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/forms.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script src="/assets/js/pagination.js"></script>
    <script>
      window.renderSharedNavigation({ activeModule: 'historico-facturas' });
    </script>
    <script src="/assets/js/bandeja-facturas.js"></script>
  </body>
</html>
