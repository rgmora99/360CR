<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bandeja operativa | 360CR</title>
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/customers.css" />
    <style>
      .sync-progress {
        display: none;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }

      .sync-progress.is-active {
        display: flex;
      }

      .sync-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-top-color: #7aa2ff;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }

      .sync-stats {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 0.92rem;
        color: var(--muted);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>
      <section class="main-panel">
        <header id="shared-topbar"></header>
        <div class="page-wrap">
          <section class="module-header card">
            <h1>Bandeja operativa de facturas electrónicas</h1>
            <p class="subtitle">Recibe y gestiona automáticamente las facturas electrónicas tramitadas.</p>
          </section>

          <section class="card">
            <div class="form-grid">
              <label>Organización<select id="organization-id"></select></label>
              <label>
                Estado
                <select id="status-filter">
                  <option value="">Todos</option>
                  <option value="pending">Pendiente</option>
                  <option value="in_process">En registro</option>
                  <option value="registered">Registrada</option>
                  <option value="rejected">Rechazada</option>
                </select>
              </label>
              <div class="actions">
                <button id="sync-now" class="btn btn-secondary" type="button">Sincronizar ahora</button>
                <small id="sync-meta" class="subtitle">Solo se sincroniza 2026 · Auto-sync cada 5 min</small>
              </div>
            </div>

            <div id="sync-progress" class="sync-progress">
              <span class="sync-spinner" aria-hidden="true"></span>
              <div class="sync-stats">
                <span id="sync-elapsed">0s</span>
                <span id="sync-year">Año 2026</span>
                <span id="sync-new-count">Nuevas: 0</span>
                <span id="sync-processed-count">Procesadas: 0</span>
              </div>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Proveedor</th>
                    <th>Factura</th>
                    <th>Subtotal</th>
                    <th>IVA</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="inbox-body"></tbody>
              </table>
            </div>
            <p id="feedback" class="subtitle"></p>
          </section>
        </div>
      </section>
    </div>

    <script src="/assets/js/navigation.js"></script>
    <script>
      window.renderSharedNavigation({ activeModule: 'bandeja-facturas' });
    </script>
    <script src="/assets/js/bandeja-facturas.js"></script>
  </body>
</html>
