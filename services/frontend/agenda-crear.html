<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear evento | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/agenda.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>

      <section class="main-panel">
        <header id="shared-topbar"></header>

        <div class="page-wrap">
          <section class="module-header card">
            <div>
              <p class="badge">Agenda</p>
              <h1>Crear evento</h1>
              <p class="subtitle">Registra una nueva cita o ajusta una existente sin salir del módulo.</p>
            </div>
            <div class="quick-actions">
              <a class="btn btn-secondary" href="/agenda-eventos.html">Ver eventos programados</a>
            </div>
          </section>

          <section class="grid single-column">
            <article class="card">
              <h2 id="form-title">Nueva cita</h2>
              <form id="event-form" class="event-form">
                <input type="hidden" id="event-id" />
                <div class="form-grid">
                  <label>Título<input id="title" required /></label>
                  <label>Tipo<select id="event-type" required></select></label>
                  <label>Servicio<select id="service-id" required></select></label>
                  <label>Colaborador<select id="collaborator-id" required></select></label>
                  <label>Estado
                    <select id="status">
                      <option value="pending">Pendiente</option>
                      <option value="done">Completado</option>
                      <option value="cancelled">Cancelado</option>
                    </select>
                  </label>
                  <label>Prioridad
                    <select id="priority">
                      <option value="low">Baja</option>
                      <option value="medium" selected>Media</option>
                      <option value="high">Alta</option>
                    </select>
                  </label>
                  <label>Inicio<input id="starts-at" type="datetime-local" required /></label>
                  <label>Fin<input id="ends-at" type="datetime-local" required /></label>
                  <label>Cliente relacionado<select id="customer-id"></select></label>
                  <label>Proveedor relacionado<select id="supplier-id"></select></label>
                  <label>Ubicación<input id="location" /></label>
                  <label>Recordatorio (min)
                    <input id="reminder-minutes" type="number" min="0" value="30" />
                  </label>
                </div>
                <label class="checkbox-label"><input id="all-day" type="checkbox" /> Todo el día</label>
                <label>Descripción<textarea id="description" rows="3"></textarea></label>
                <div class="actions">
                  <button class="btn btn-primary" type="submit">Guardar</button>
                  <button id="cancel-edit" class="btn btn-secondary" type="button">Cancelar edición</button>
                </div>
              </form>
              <p id="feedback" class="subtitle"></p>
            </article>
          </section>

          <section class="card self-book-card">
            <h2>Portal de autoagendamiento</h2>
            <p class="subtitle">Comparte un link externo e independiente para que tus clientes solo puedan agendar.</p>
            <label>
              Link dinámico por organización
              <input id="self-book-link" readonly />
            </label>
            <div class="self-book-actions">
              <button class="btn btn-primary" type="button" id="open-self-book-link">Abrir portal cliente</button>
              <button class="btn btn-secondary" type="button" id="copy-self-book-link">Copiar link</button>
            </div>
            <p id="self-book-link-feedback" class="subtitle">Selecciona una organización activa para generar el link.</p>
          </section>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script>
      window.renderSharedNavigation({ activeModule: 'agenda-crear' });
    </script>
    <script src="/assets/js/agenda.js"></script>
  </body>
</html>
