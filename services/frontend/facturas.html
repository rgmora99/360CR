<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facturas emitidas | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/facturacion.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>
      <section class="main-panel">
        <header id="shared-topbar"></header>
        <div class="page-wrap">
          <section class="module-header card">
            <h1>Listado de facturas emitidas</h1>
            <p class="subtitle">Consulte, descargue PDF y reenvíe por correo.</p>
          </section>
          <section class="card filters">
            <label>API base<input id="api-base" value="/api" /></label>
            <label>Organización<input id="organization-id" type="number" min="1" value="1" /></label>
            <button class="btn btn-primary" id="reload" type="button">Recargar</button>
            <a class="btn btn-secondary" href="/facturacion.html">Ir a Facturación</a>
          </section>
          <section class="card">
            <div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody id="invoices-body"></tbody></table></div>
            <p id="feedback" class="subtitle"></p>
          </section>
        </div>
      </section>
    </div>
    <script src="/assets/js/navigation.js"></script>
    <script>window.renderSharedNavigation({ activeModule: 'facturacion' });</script>
    <script src="/assets/js/facturas.js"></script>
  </body>
</html>
