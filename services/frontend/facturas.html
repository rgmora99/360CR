<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facturas emitidas | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/customers.css" />
    <link rel="stylesheet" href="/assets/css/pages/facturacion.css" />
    <style>
      .invoice-detail-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(2, 6, 23, 0.74);
        z-index: 1100;
      }

      .invoice-detail-modal.is-open {
        display: flex;
      }

      .invoice-detail-panel {
        width: min(1100px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: #10192d;
        border: 1px solid rgba(122, 162, 255, 0.26);
        border-radius: 18px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        padding: 20px;
      }

      .invoice-detail-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .invoice-detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .invoice-detail-card {
        padding: 16px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.16);
      }

      .invoice-detail-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 16px;
      }

      .invoice-detail-meta span {
        display: block;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .invoice-detail-meta strong {
        display: block;
        margin-top: 2px;
      }

      .invoice-detail-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .invoice-detail-line:last-child {
        border-bottom: 0;
      }

      @media (max-width: 900px) {
        .invoice-detail-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>
      <section class="main-panel">
        <header id="shared-topbar"></header>
        <div class="page-wrap">
          <section class="module-header card">
            <h1>Listado de facturas emitidas</h1>
            <p class="subtitle">Consulte, descargue PDF, reenvíe por correo y vea el detalle completo.</p>
          </section>
          <section class="card filters">
            <label>Organización<select id="organization-id"></select></label>
            <button class="btn btn-primary" id="reload" type="button">Recargar</button>
            <a class="btn btn-secondary" href="/facturacion.html">Ir a Facturación</a>
          </section>
          <section class="card">
            <div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody id="invoices-body"></tbody></table></div>
            <p id="feedback" class="subtitle"></p>
          </section>
        </div>
      </section>
    </div>

    <div id="invoice-detail-modal" class="invoice-detail-modal" aria-hidden="true">
      <div class="invoice-detail-panel">
        <div class="invoice-detail-header">
          <div>
            <h2 id="invoice-detail-title">Detalle de factura</h2>
            <p id="invoice-detail-subtitle" class="subtitle"></p>
          </div>
          <button id="invoice-detail-close" class="btn btn-secondary" type="button">Cerrar</button>
        </div>
        <div class="invoice-detail-grid">
          <section class="invoice-detail-card">
            <h3>Información general</h3>
            <div id="invoice-detail-meta" class="invoice-detail-meta"></div>
          </section>
          <section class="invoice-detail-card">
            <h3>Datos adicionales</h3>
            <div id="invoice-detail-extra" class="invoice-detail-meta"></div>
          </section>
          <section class="invoice-detail-card">
            <h3>Líneas de factura</h3>
            <div id="invoice-detail-lines"></div>
          </section>
          <section class="invoice-detail-card">
            <h3>Acciones rápidas</h3>
            <div id="invoice-detail-actions" class="actions"></div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script>window.renderSharedNavigation({ activeModule: 'facturacion-listado' });</script>
    <script src="/assets/js/facturas.js"></script>
  </body>
</html>
