<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporteria | 360CR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/pages/customers.css" />
    <link rel="stylesheet" href="/assets/css/pages/facturacion.css" />
  </head>
  <body>
    <div class="dashboard-layout">
      <aside id="shared-sidebar"></aside>
      <section class="main-panel">
        <header id="shared-topbar"></header>
        <div class="page-wrap">
          <section class="module-header card">
            <div>
              <h1>Reporteria</h1>
              <p class="subtitle">Indicadores operativos y financieros centralizados con filtros y exportacion del resultado visible.</p>
            </div>
            <div class="quick-actions">
              <button class="btn btn-primary" id="export-excel" type="button" data-export-excel>Descargar Excel</button>
              <button class="btn btn-secondary" id="export-pdf" type="button">Exportar PDF</button>
            </div>
          </section>

          <section class="card filters">
            <div class="invoice-filters-grid report-filters-grid">
              <label>Organizacion
                <select id="organization-id"></select>
              </label>
              <label>Reporte
                <select id="report-type">
                  <option value="sales">Ventas y facturas</option>
                  <option value="receivables">Cuentas por cobrar</option>
                  <option value="shipments">Envios</option>
                  <option value="purchases">Compras</option>
                  <option value="agenda">Agenda</option>
                  <option value="executive">Resumen ejecutivo</option>
                </select>
              </label>
              <label>Desde
                <input id="date-from" type="date" />
              </label>
              <label>Hasta
                <input id="date-to" type="date" />
              </label>
              <label>Estado
                <select id="status-filter"></select>
              </label>
              <label>Buscar
                <input id="search-filter" type="text" placeholder="Factura, cliente, producto o destino" />
              </label>
              <label class="report-sales-filter">Medio de pago
                <select id="payment-filter">
                  <option value="">Todos</option>
                  <option value="01">Efectivo</option>
                  <option value="02">Tarjeta</option>
                  <option value="03">Transferencia</option>
                  <option value="04">SINPE Movil</option>
                  <option value="05">A plazos</option>
                </select>
              </label>
              <label class="report-sales-filter">Documento
                <select id="document-filter">
                  <option value="">Todos</option>
                  <option value="01">Factura electronica</option>
                  <option value="03">Nota de credito</option>
                </select>
              </label>
              <div class="invoice-filters-actions">
                <button class="btn btn-primary" id="reload" type="button">Generar</button>
                <button class="btn btn-secondary" id="clear-filters" type="button">Limpiar filtros</button>
              </div>
            </div>
          </section>

          <section class="invoice-summary-grid report-summary-grid" id="summary-grid"></section>

          <section class="report-charts-grid" id="charts-grid"></section>

          <section class="card report-table-card">
            <div class="report-table-header">
              <div>
                <h2 id="report-title">Ventas y facturas</h2>
                <p id="report-caption" class="subtitle">Cargando informacion...</p>
              </div>
              <div class="report-table-actions">
                <strong id="report-row-count" class="report-row-count">0 registros</strong>
                <button class="btn btn-secondary" type="button" data-export-excel>Descargar Excel</button>
              </div>
            </div>
            <div class="table-wrap">
              <table id="report-table">
                <thead id="report-head"></thead>
                <tbody id="report-body"></tbody>
              </table>
            </div>
            <p id="feedback" class="subtitle"></p>
          </section>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/forms.js"></script>
    <script src="/assets/js/alerts.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script src="/assets/js/pagination.js"></script>
    <script>window.renderSharedNavigation({ activeModule: 'reporteria' });</script>
    <script src="/assets/js/reporteria.js"></script>
  </body>
</html>
